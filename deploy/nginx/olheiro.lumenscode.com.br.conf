# Bloco para o nginx do stack `back` (VPS Lumens / webbotss).
# Inserir DENTRO de `http { ... }` em:
#   /var/lib/jenkins/workspace/back/nginx.conf
#
# Depois:
#   docker exec back-nginx-1 nginx -t && docker exec back-nginx-1 nginx -s reload
#
# Pré-requisitos:
# 1) DNS A: olheiro.lumenscode.com.br → 213.199.53.216
# 2) Certificado incluindo o subdomínio:
#    certbot certonly --nginx -d lumenscode.com.br -d hub.lumenscode.com.br -d olheiro.lumenscode.com.br \
#      --cert-name lumenscode.com.br --expand
#    (ou cert separado em /etc/letsencrypt/live/olheiro.lumenscode.com.br/)

upstream olheiro_web {
    server host.docker.internal:4090;
    keepalive 16;
}

upstream olheiro_api {
    server host.docker.internal:4091;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name olheiro.lumenscode.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name olheiro.lumenscode.com.br;

    # Após expandir o cert do apex; se usar cert dedicado, ajuste os paths.
    ssl_certificate     /etc/letsencrypt/live/lumenscode.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumenscode.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # API Go (predictions, billing, webhook AbacatePay)
    location ^~ /v1/ {
        proxy_pass http://olheiro_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://olheiro_api/health;
    }

    # Next.js (Olheiro web)
    location / {
        proxy_pass http://olheiro_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
