name: olheiro

services:
  api:
    container_name: olheiro-api
    image: olheiro-api:${IMAGE_TAG:-latest}
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4091}:8080"
    env_file:
      - .env
    environment:
      SCOUTER_API_PORT: "8080"
    restart: unless-stopped

  web:
    container_name: olheiro-web
    image: olheiro-web:${IMAGE_TAG:-latest}
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        SCOUTER_API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4090}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SCOUTER_API_ORIGIN: http://api:8080
    depends_on:
      - api
    restart: unless-stopped
