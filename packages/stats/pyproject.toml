[project]
name = "scouter-stats"
version = "0.1.0"
description = "Statistical prior engine for Scouter IA (Poisson/Elo)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "supabase>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
scouter-spike = "scouter_stats.spike:main"
scouter-backtest = "scouter_stats.backtest:main"
scouter-ingest = "scouter_stats.ingest:main"
scouter-judge = "scouter_stats.judge:main"
scouter-context = "scouter_stats.context_ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scouter_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
